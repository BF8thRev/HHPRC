name: Deploy

# Deploys main to production. Add required reviewers to the "production"
# environment in GitHub (Settings → Environments) to require a manual approval.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check Cloudflare setup
        run: |
          if grep -q REPLACE_WITH_PROD_D1_ID wrangler.jsonc; then
            echo "::error::Set the hhprc-prod database_id in wrangler.jsonc (see docs/SETUP.md)."
            exit 1
          fi

      - name: Apply migrations to production DB
        run: pnpm db:migrate:prod

      - name: Deploy
        run: pnpm run deploy
