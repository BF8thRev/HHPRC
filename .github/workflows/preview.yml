name: Preview

# Uploads each PR as a version of the hhprc-preview Worker with its own URL
# (pr-<number>-hhprc-preview.<account>.workers.dev). Previews use the
# hhprc-preview D1 database and test data only.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Previews share one D1 database, so migrations must not run concurrently.
concurrency:
  group: preview-db
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Secrets aren't available to forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check Cloudflare setup
        run: |
          if grep -q REPLACE_WITH_PREVIEW_D1_ID wrangler.jsonc; then
            echo "::error::Set the hhprc-preview database_id in wrangler.jsonc (see docs/SETUP.md)."
            exit 1
          fi

      - name: Apply migrations to preview DB
        run: pnpm db:migrate:preview

      - name: Build for preview
        run: pnpm build
        env:
          CLOUDFLARE_ENV: preview

      - name: Upload preview version
        id: upload
        run: |
          set -o pipefail
          upload() {
            pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" 2>&1 | tee upload.log
          }
          if ! upload; then
            # Versions can only be uploaded to a Worker that exists; the very
            # first preview creates hhprc-preview with a normal deploy.
            grep -q "does not yet exist" upload.log || exit 1
            echo "Creating the hhprc-preview Worker"
            pnpm exec wrangler deploy
            upload
          fi
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::No preview URL in Wrangler output. Is a workers.dev subdomain registered for the account?"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none \
            --body "Preview is ready: ${{ steps.upload.outputs.url }} (health check: ${{ steps.upload.outputs.url }}/healthz)"
